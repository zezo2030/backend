# RealEstateBroker API — Render Blueprint
# Sync from the Dashboard or connect this repo as a Blueprint.
# Secrets: set values in Dashboard (sync: false); never commit real keys.

envVarGroups:
  - name: realestate-api-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://readstatadmin.vercel.app,http://localhost:5173
      # Supabase Postgres (see .env.example)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: PUSH_PROVIDER
        value: fcm
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_HOST
        sync: false
      - key: MAIL_SMTP_PORT
        sync: false
      - key: MAIL_SMTP_USER
        sync: false
      - key: MAIL_SMTP_PASS
        sync: false
      - key: OWNER_EMAIL
        value: mhd7190@gmail.com
      - key: MEDIA_COMPRESSION_ENABLED
        value: "true"
      - key: IMAGE_MAX_DIMENSION
        value: "1920"
      - key: IMAGE_WEBP_QUALITY
        value: "80"
      - key: VIDEO_MAX_HEIGHT
        value: "720"

services:
  - type: web
    name: realestate-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: realestate-api-shared
      - key: DEV_RUN_WORKER
        value: "false"

  - type: worker
    name: realestate-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:worker
    envVars:
      - fromGroup: realestate-api-shared
